<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axen | Radical Energy Transparency</title>
    
    <!-- Google Fonts: Inter (but heavily weighted) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { axen: { pitch: '#000000', paper: '#F7F7F7', electric: '#CCFF00' } }
                }
            }
        }
    </script>
    <style>
        /* Minimalist grid background */
        .bg-grid {
            background-image: linear-gradient(to right, #e5e5e5 1px, transparent 1px), linear-gradient(to bottom, #e5e5e5 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="bg-axen-paper text-axen-pitch font-sans antialiased bg-grid min-h-screen flex flex-col">

    <!-- Stark Navbar -->
    <nav class="w-full border-b-2 border-axen-pitch bg-white">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="text-3xl font-black tracking-tighter">AXEN.</div>
            <a href="#quote" class="font-bold text-sm hover:underline underline-offset-4 decoration-2">Get Started &rarr;</a>
        </div>
    </nav>

    <!-- Hero / Main -->
    <main class="flex-grow flex items-center py-20">
        <div class="max-w-7xl mx-auto px-6 w-full grid lg:grid-cols-2 gap-16 items-center">
            
            <!-- Left Side: Massive Copy -->
            <div>
                <h1 class="text-6xl md:text-8xl font-black leading-[0.9] tracking-tighter mb-8">
                    ENERGY <br> MADE EASY.
                </h1>
                <p class="text-xl md:text-2xl font-medium mb-10 max-w-lg leading-snug">
                    No aggressive phone calls. No hidden broker fees. Just a direct API pipe to wholesale UK energy rates.
                </p>
                <div class="flex gap-4">
                    <div class="px-6 py-3 border-2 border-axen-pitch bg-white font-bold flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        100% Digital
                    </div>
                    <div class="px-6 py-3 border-2 border-axen-pitch bg-white font-bold flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Zero Hidden Fees
                    </div>
                </div>
            </div>

            <!-- Right Side: High Contrast Action Box -->
            <div id="quote" class="bg-axen-pitch text-white p-10 border-4 border-axen-pitch shadow-[16px_16px_0px_0px_rgba(204,255,0,1)]">
                <h2 class="text-3xl font-black mb-2">Drop your details.</h2>
                <p class="text-gray-400 mb-8 font-medium">Get a transparent market report in 10 minutes.</p>
                
                <form class="space-y-6" onsubmit="event.preventDefault();">
                    <div>
                        <label class="block text-sm font-bold mb-2">Business Email</label>
                        <input type="email" class="w-full bg-white text-black px-4 py-3 border-2 border-transparent focus:border-axen-electric outline-none" required>
                    </div>
                    <div>
                        <label class="block text-sm font-bold mb-2">Annual Spend</label>
                        <select class="w-full bg-white text-black px-4 py-3 border-2 border-transparent focus:border-axen-electric outline-none">
                            <option>Less than £20k</option>
                            <option>£20k - £100k</option>
                            <option>£100k+</option>
                        </select>
                    </div>
                    <button class="w-full bg-axen-electric text-axen-pitch text-xl font-black py-4 hover:bg-white transition-colors">
                        GET PRICING
                    </button>
                </form>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t-2 border-axen-pitch bg-white py-6">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center font-bold text-sm">
            <span>Axen UK Ltd.</span>
            <a href="#" class="hover:underline">Privacy & Terms</a>
        </div>
    </footer>

</body>
</html>
